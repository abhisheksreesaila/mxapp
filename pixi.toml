[workspace]
authors = ["abhisheksreesaila <abhishek.sreesaila@gmail.com>"]
channels = ["conda-forge"]
name = "mojo-ui"
platforms = [
  { name = "linux-glibc-234", platform = "linux-64", glibc = "2.34" },
  { name = "macos-13", platform = "osx-arm64", macos = "13.0" },
]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
lld = ">=23.1.3,<24"
python-fasthtml = ">=0.14.13,<0.15"

[pypi-dependencies]
mojo = ">=1.1, <1.2"
playwright = ">=1.64.0, <2"
