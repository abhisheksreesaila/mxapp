<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>omxplorer · Ledger · the full component kit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="omx.css">
<style>
/* ---------- floating things: one shadow, the only depth in the theme ---------- */
main { --shadow:0 4px 16px rgba(16,24,40,.12), 0 1px 3px rgba(16,24,40,.08); --scrim:rgba(17,22,28,.32); }
main.graphite { --shadow:0 6px 20px rgba(0,0,0,.55), 0 0 0 1px #34363b; --scrim:rgba(0,0,0,.5); }
.ico { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.menu { position:absolute; z-index:4; min-width:270px; background:var(--surface); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); padding:4px; font-size:12.5px; color:var(--ink); }
.mi { display:flex; align-items:center; gap:10px; height:28px; padding:0 10px; border-radius:4px; white-space:nowrap; }
.mi .ico { color:var(--sub); } .mi .k { margin-left:auto; padding-left:24px; color:var(--sub); font:11px "JetBrains Mono"; } .mi .ch { margin-left:auto; color:var(--sub); }
.mi .blank { width:15px; flex:none; }
.mi.hi { background:var(--sel); } .mi.hi .ico { color:var(--accent); }
.mi.off { color:var(--sub); opacity:.6; } .mi.danger, .mi.danger .ico { color:var(--bad); }
.mlabel { padding:6px 10px 4px; font:600 10.5px Inter; letter-spacing:.8px; text-transform:uppercase; color:var(--sub); }
.sep { height:1px; background:var(--line); margin:4px 6px; }
.tip { position:absolute; z-index:5; background:var(--ink); color:var(--surface); font-size:12px; padding:7px 10px; border-radius:4px; max-width:260px; line-height:1.4; box-shadow:var(--shadow); }
.tip b { font-weight:600; } .tip .kbd { background:transparent; color:inherit; border-color:color-mix(in srgb, var(--surface) 40%, transparent); }
.toast { position:absolute; z-index:5; display:flex; align-items:center; gap:14px; background:var(--ink); color:var(--surface); padding:10px 12px 10px 14px; border-radius:6px; font-size:12.5px; box-shadow:var(--shadow); }
.toast .act { color:color-mix(in srgb, var(--accent) 55%, var(--surface)); font-weight:600; } .graphite .toast .act { color:#a0640a; }
.toast .ico { color:var(--good); } .graphite .toast .ico { color:#1f8a4c; }
.kbd { display:inline-block; font:500 10.5px "JetBrains Mono"; padding:1px 5px; border:1px solid var(--strong); border-bottom-width:2px; border-radius:4px; color:var(--body); background:var(--surface); }
.scrim { position:absolute; inset:0; z-index:3; background:var(--scrim); }
.dlg { position:absolute; z-index:4; left:50%; transform:translateX(-50%); background:var(--surface); color:var(--ink); border-radius:8px; box-shadow:0 16px 48px rgba(0,0,0,.28); display:flex; flex-direction:column; overflow:hidden; }
.dlg .dh { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); } .dlg .dh h2 { margin:0; font-size:15px; font-weight:600; } .dlg .dh .sub { color:var(--sub); font-size:12px; }
.dlg .dh .x { margin-left:auto; color:var(--sub); }
.dlg .db { padding:16px 20px; display:flex; flex-direction:column; gap:14px; }
.dlg .df { display:flex; align-items:center; gap:10px; padding:12px 20px; border-top:1px solid var(--line); background:var(--raised); }
.btn { height:30px; padding:0 14px; display:inline-flex; align-items:center; gap:7px; border-radius:6px; border:1px solid var(--strong); background:var(--surface); color:var(--ink); font:500 12.5px Inter; white-space:nowrap; }
.btn.pri { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.subtle { border-color:transparent; background:transparent; color:var(--body); }
.btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
.btn.hover { background:var(--raised); } .btn.pri.hover { background:color-mix(in srgb, var(--accent) 86%, #000); } .btn.subtle.hover { background:var(--raised); } .btn.danger.hover { background:color-mix(in srgb, var(--bad) 86%, #000); }
.btn.press { background:var(--chrome-hover); } .btn.pri.press { background:color-mix(in srgb, var(--accent) 74%, #000); } .btn.subtle.press { background:var(--chrome-hover); } .btn.danger.press { background:color-mix(in srgb, var(--bad) 74%, #000); }
.btn.focus { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.btn.dis { opacity:.45; }
.btn.icon { width:30px; padding:0; justify-content:center; }
.inp { height:30px; display:flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--strong); border-radius:4px; background:var(--surface); color:var(--ink); font-size:12.5px; min-width:0; }
.inp .ph2 { color:var(--sub); } .inp .ico { color:var(--sub); }
.inp.focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.inp.err { border-color:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 14%, transparent); }
.inp.dis { background:var(--raised); color:var(--sub); }
.caret { display:inline-block; width:1px; height:15px; background:var(--accent); margin-left:-6px; }
.help { font-size:11.5px; color:var(--sub); } .help.err { color:var(--bad); }
.field { display:flex; flex-direction:column; gap:5px; } .field label { font-size:12px; font-weight:500; color:var(--body); }
.cb { width:15px; height:15px; border:1.5px solid var(--strong); border-radius:3px; display:inline-grid; place-items:center; flex:none; background:var(--surface); }
.cb.on, .cb.mix { background:var(--accent); border-color:var(--accent); } .cb.on::after { content:""; width:8px; height:4px; border:2px solid var(--on-accent); border-top:0; border-right:0; transform:translateY(-1px) rotate(-45deg); }
.cb.mix::after { content:""; width:8px; height:2px; background:var(--on-accent); }
.rd { width:15px; height:15px; border:1.5px solid var(--strong); border-radius:50%; display:inline-grid; place-items:center; flex:none; } .rd.on { border-color:var(--accent); } .rd.on::after { content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }
.switch.off { background:var(--strong); } .switch.off::after { right:auto; left:2px; background:#fff; }
.opt { display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--body); }
.slider { position:relative; height:16px; width:220px; } .slider::before { content:""; position:absolute; left:0; right:0; top:7px; height:3px; border-radius:2px; background:var(--line); }
.slider i { position:absolute; left:0; top:7px; height:3px; border-radius:2px; background:var(--accent); } .slider b { position:absolute; top:0; width:16px; height:16px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); margin-left:-8px; }
.bar { height:6px; border-radius:3px; background:var(--raised); overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); } .bar i { display:block; height:100%; background:var(--accent); border-radius:3px; }
.bar.ind i { width:30%; margin-left:35%; background:linear-gradient(90deg, transparent, var(--accent), transparent); }
.spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); display:inline-block; }
.skel { height:10px; border-radius:3px; background:var(--raised); }
.banner { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:6px; font-size:12.5px; line-height:1.45; border:1px solid; }
.banner.warn { background:color-mix(in srgb, var(--warn) 9%, var(--surface)); border-color:color-mix(in srgb, var(--warn) 35%, transparent); } .banner.warn .ico { color:var(--warn); }
.banner.info { background:color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color:color-mix(in srgb, var(--accent) 30%, transparent); } .banner.info .ico { color:var(--accent); }
.banner.bad { background:color-mix(in srgb, var(--bad) 8%, var(--surface)); border-color:color-mix(in srgb, var(--bad) 30%, transparent); } .banner.bad .ico { color:var(--bad); }
.banner a { color:var(--accent); font-weight:600; text-decoration:none; margin-left:6px; }
.tabs2 { display:flex; gap:18px; border-bottom:1px solid var(--line); } .tabs2 span { padding:8px 0; font-size:12.5px; color:var(--sub); font-weight:500; } .tabs2 span.on { color:var(--ink); box-shadow:inset 0 -2px var(--accent); }
.typechip { display:inline-flex; align-items:center; gap:5px; font:500 11px "JetBrains Mono"; padding:2px 6px; border:1px solid var(--line); border-radius:4px; color:var(--body); background:var(--surface); }
.typechip::after { content:"⌄"; color:var(--sub); }
.count { font:500 11px "JetBrains Mono"; color:var(--sub); margin-left:auto; }

/* grid cell states */
.grid th .sorted, .grid th .filt { float:right; color:var(--accent); } .grid th .sorted svg, .grid th .filt svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; }
.grid td.edited { position:relative; } .grid td.edited::before { content:""; position:absolute; right:0; top:0; border:5px solid transparent; border-top-color:var(--accent); border-right-color:var(--accent); }
.grid td.null { color:var(--sub); font-style:italic; opacity:.7; }
.grid td.errc { color:var(--bad); }
.grid td.match { background:color-mix(in srgb, var(--warn) 22%, var(--surface)); }
.grid td.range { background:var(--sel); } .grid td.editing { outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.grid .frozen { border-right:2px solid var(--strong) !important; }

/* specimen board */
.board { width:1400px; background:var(--page); color:var(--ink); padding:24px; border-radius:10px; font:13px Inter; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; box-shadow:0 0 0 1px #2a2b30; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:12px; }
.panel.w2 { grid-column:span 2; } .panel.w3 { grid-column:span 3; }
.panel h4 { margin:0; font:600 10.5px Inter; letter-spacing:.8px; color:var(--sub); text-transform:uppercase; }
.line { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .line .lab { width:70px; font-size:11.5px; color:var(--sub); }
.menu.static { position:static; box-shadow:var(--shadow); }
.swatches { display:grid; grid-template-columns:repeat(8, 1fr); gap:8px; } .sw { height:40px; border-radius:4px; border:1px solid var(--line); } .swl { font:10.5px "JetBrains Mono"; color:var(--sub); margin-top:3px; }

/* skin picker */
.skins { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
.skin { border:1px solid var(--line); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:8px; }
.skin.on { border:2px solid var(--accent); padding:7px; }
.mini { height:110px; border-radius:4px; overflow:hidden; background:var(--page); display:grid; grid-template-rows:14px 16px 1fr 8px; border:1px solid var(--line); }
.mini .a { background:var(--chrome); } .mini .b { background:var(--chrome); border-bottom:1px solid var(--chrome-line); display:flex; gap:4px; padding:4px 6px; } .mini .b i { width:14px; background:var(--chrome-line); border-radius:2px; } .mini .b i.on { background:var(--accent); }
.mini .c { background:var(--surface); background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:100% 11px, 34px 100%; position:relative; }
.mini .c::after { content:""; position:absolute; left:68px; top:22px; width:34px; height:11px; outline:2px solid var(--accent); outline-offset:-1px; }
.mini .d { background:var(--chrome); }
.skin .nm { display:flex; align-items:center; gap:8px; font-weight:600; font-size:12.5px; } .skin .nm small { color:var(--sub); font-weight:400; margin-left:auto; }

/* start screen */
.start { grid-row:3 / 5; display:grid; grid-template-columns:300px 1fr; background:var(--page); min-height:0; }
.start .side { background:var(--surface); border-right:1px solid var(--line); padding:22px 18px; display:flex; flex-direction:column; gap:6px; }
.start .side .mi { height:34px; font-size:13px; }
.start .mainc { padding:30px 40px; display:flex; flex-direction:column; gap:22px; overflow:hidden; }
.drop { border:1.5px dashed var(--strong); border-radius:8px; background:var(--surface); padding:26px; display:flex; align-items:center; gap:18px; }
.drop .big { width:48px; height:48px; border-radius:10px; background:var(--sel); color:var(--accent); display:grid; place-items:center; } .drop .big svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.samples { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
.sample { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px; display:flex; flex-direction:column; gap:6px; }
.sample .t { font-weight:600; } .sample .s { color:var(--sub); font-size:12px; }
h3.sec2 { margin:0; font-size:13px; font-weight:600; }
.recent { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; font-size:12.5px; }
.recent td, .recent th { padding:9px 14px; border-bottom:1px solid var(--line); text-align:left; } .recent th { background:var(--raised); color:var(--sub); font-weight:500; font-size:12px; }
.recent td.n { font-family:"JetBrains Mono"; text-align:right; color:var(--body); } .recent th.n { text-align:right; } .recent tr.hi td { background:var(--sel); }
.fileic { display:inline-flex; vertical-align:-3px; margin-right:8px; color:var(--accent); }

/* palette */
.pal { width:640px; top:110px; }
.pal .inp { border:0; box-shadow:none; height:48px; font-size:15px; padding:0 18px; border-bottom:1px solid var(--line); border-radius:0; }
.pal .res { padding:6px; max-height:520px; } .pal .mi { height:34px; font-size:13px; } .pal .mi em { font-style:normal; color:var(--accent); font-weight:600; }
.pal .foot { display:flex; gap:16px; padding:8px 14px; border-top:1px solid var(--line); background:var(--raised); font-size:11.5px; color:var(--sub); }

.title2 { color:#9a9ca3; font-size:13px; margin:0 0 14px; max-width:980px; line-height:1.5; }
.frame.phone .ph .scrim { border-radius:0; }
</style>
</head>
<body>
<header class="viewer">
  <h1>omxplorer · the full component kit</h1>
  <div class="seg" id="skin"><button class="on" onclick="skin('ledger',this)">Ledger (default)</button><button onclick="skin('graphite',this)">Graphite</button><button onclick="skin('blueprint',this)">Blueprint</button></div>
  <div class="seg" id="sz"><button class="on" onclick="size(0,this)">Overview</button><button onclick="size(1,this)">Actual size</button></div>
</header>
<main id="main" class="ledger"></main>

<script src="omx.js"></script>
<script>
const ic = (k, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24">${I[k]}</svg>`;
const mi = (label, o = {}) => `<div class="mi ${o.cls || ""}">${o.icon ? ic(o.icon) : `<span class="blank">${o.check ? ic("check") : ""}</span>`}<span>${label}</span>${o.k ? `<span class="k">${o.k}</span>` : ""}${o.sub ? `<span class="ch">${ic("right")}</span>` : ""}</div>`;
const SEP = `<div class="sep"></div>`;
const menu = (items, style, cls = "") => `<div class="menu ${cls}" style="${style}">${items.join("")}</div>`;
const kbd = k => `<span class="kbd">${k}</span>`;

// Overlays are placed against the element they belong to, measured after layout (offsets ignore the zoom).
function at(app, sel, dx = 0, dy = 0) { let el = app.querySelector(sel), x = 0, y = 0; while (el && el !== app) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return [x + dx, y + dy]; }
const placed = []; // [sceneId, selector, overlayId, dx, dy, alignRight]
const scene = (id, html, overlays = "") => `<div class="app" id="${id}">${html.replace(/^<div class="app">/, "").replace(/<\/div>$/, "")}${overlays}</div>`;

// 1 · the menu bar with Data open and a submenu
function s1() {
  const data = menu([
    mi("Sort ascending", {icon:"sort", k:"Ctrl+Shift+↑"}), mi("Sort descending", {k:"Ctrl+Shift+↓"}), mi("Sort by several columns…"), SEP,
    mi("Filter", {icon:"filter", check:true, k:"Ctrl+Shift+L"}), mi("Clear all filters", {cls:"off"}), SEP,
    mi("Add formula column", {icon:"formula", k:"="}), mi("Group by", {icon:"group", sub:true, cls:"hi"}), mi("Pivot table…", {icon:"pivot", k:"Ctrl+Alt+P"}), SEP,
    mi("Clean up text values", {icon:"sparkle", sub:true}), mi("Remove duplicate rows…"), SEP,
    mi("Import data…", {icon:"upload", k:"Ctrl+I"}), mi("Refresh from source", {icon:"db", k:"F5"})], "", "") .replace('class="menu "', 'class="menu " id="m-data"');
  const sub = menu([`<div class="mlabel">Group revenue by</div>`, mi("region", {cls:"hi", k:"5 values"}), mi("customer", {k:"10"}), mi("product", {k:"6"}), mi("carrier", {k:"4"}), mi("date · month", {k:"9"}), SEP, mi("Choose columns…")], "", "").replace('class="menu "', 'class="menu " id="m-sub"');
  placed.push(["s1", ".menus span.open", "m-data", 0, 30], ["s1", "#m-data .mi.hi", "m-sub", 0, -5, "beside:m-data"]);
  return scene("s1", sheet().replace(chrome("orders.csv", false), chrome("orders.csv", false, "Data")), data + sub);
}
// 2 · right-click a column header, and a tooltip on a toolbar button
function s2() {
  const ctx = `<div class="menu" id="m-ctx">${[`<div class="mlabel">revenue · Currency</div>`, mi("Sort smallest → largest", {icon:"sort"}), mi("Sort largest → smallest"), SEP,
    mi("Filter this column…", {icon:"filter", cls:"hi"}), mi("Format as", {icon:"format", sub:true}), mi("Column stats", {icon:"chart", k:"Ctrl+Shift+I"}), SEP,
    mi("Insert formula column right", {icon:"formula"}), mi("Rename…", {icon:"rename", k:"F2"}), mi("Hide column", {icon:"eyeoff"}), mi("Copy column name", {icon:"copy"}), SEP,
    mi("Delete column", {icon:"trash", cls:"danger", k:"Ctrl+−"})].join("")}</div>`;
  const tip = `<div class="tip" id="t-pivot"><b>Pivot table</b> ${kbd("Ctrl+Alt+P")}<br>Summarise revenue by rows and columns. Runs on the GPU.</div>`;
  placed.push(["s2", "th.selcol", "m-ctx", 60, 40], ["s2", ".toolbar .group:nth-child(2) .tool:nth-child(3)", "t-pivot", 0, 64]);
  const html = sheet().replace('<div class="tool hover">', '<div class="tool ">').replace(tool("pivot", "Pivot"), tool("pivot", "Pivot", "hover"));
  return scene("s2", html, ctx + tip);
}
// 3 · the column filter popover, and the toast after it applies
function s3() {
  const vals = [["West","255,102",1],["East","248,991",1],["North","201,430",0],["South","180,027",1],["Central","114,450",0]];
  const pop = `<div class="menu" id="p-filter" style="width:300px;padding:0">
    <div style="padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px">Filter region</b><span class="count">5 values</span></div>
      <div class="segc"><span class="on">Values</span><span>Condition</span></div>
      <div class="inp focus">${ic("search")}<span class="ph2">Search values</span></div></div>
    <div style="padding:0 6px 6px"><div class="mi"><span class="cb mix"></span>Select all<span class="count">1,000,000</span></div>${SEP}
      ${vals.map(([v,n,on]) => `<div class="mi ${v==="North"?"hi":""}"><span class="cb ${on?"on":""}"></span>${v}<span class="count">${n}</span></div>`).join("")}
      <div class="mi"><span class="cb"></span><i style="color:var(--sub)">empty</i><span class="count">0</span></div></div>
    <div style="display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--raised)"><span class="btn subtle">Clear</span><span style="flex:1"></span><span class="btn">Cancel</span><span class="btn pri">Apply</span></div></div>`;
  const toast = `<div class="toast" style="left:430px;bottom:80px">${ic("check")}Filtered to 618,120 of 1,000,000 rows in 1.2 ms<span class="act">Undo</span>${ic("x")}</div>`;
  placed.push(["s3", "thead th:nth-child(4)", "p-filter", 0, 58]);
  let html = sheet().replace(/(<th class="" style="width:\d+px">region<span class="badge ">Aa<\/span>)/, `$1<span class="filt">${ic("filter","")}</span>`);
  return scene("s3", html, pop + toast);
}
// 4 · Import: a preview first, types per column, then the load streams in the background
function s4() {
  const cols = [["order_id","# int","0",""],["date","date","0",""],["region","Aa text","0","5 distinct"],["customer","Aa text","12","10 distinct"],["revenue","$ 0.00","0",""],["cost","$ 0.00","0","3 didn't parse"]];
  const sample = [["1048213","2026-07-03","West","Acme Labs","$1,204.50","$811.20"],["1048250","2026-07-11","East","Globex","$88.00","$61.10"],["1048287","2026-07-19","North","Initech","$412.75","$297.40"],["1048324","2026-07-02","West","","$1,950.00","12.x"]];
  const dlg = `<div class="scrim"></div><div class="dlg" style="top:84px;width:960px">
    <div class="dh">${ic("upload")}<h2>Import orders_2026.csv</h2><span class="sub">4.2 GB · about 108 million rows</span><span class="x">${ic("x")}</span></div>
    <div class="db">
      <div class="tabs2"><span class="on">1 · Preview</span><span>2 · Columns</span><span>3 · Load</span></div>
      <div class="line"><div class="field"><label>Separator</label><div class="segc" style="width:240px"><span class="on">Comma</span><span>Tab</span><span>;</span><span>|</span></div></div>
        <div class="field"><label>Encoding</label><div class="dd" style="height:30px;align-items:center;min-width:120px">UTF-8</div></div>
        <div class="field"><label>First row is the header</label><div style="height:30px;display:flex;align-items:center"><div class="switch"></div></div></div>
        <div class="field" style="margin-left:auto"><label>Name</label><div class="inp" style="width:220px">orders_2026</div></div></div>

function render() {
  placed.length = 0; seed = 7;
  const desk = (id, html, cap) => `<div><div class="frame desk">${html}</div><div class="cap">${cap}</div></div>`;
  document.getElementById("main").innerHTML = `
  <section class="option"><h2>In the app</h2><p class="title2">The pieces the first artboards didn't show. The menu bar sits in the title bar on Linux, Windows and the web; on a Mac the same menus go to the system menu bar. Everything else is drawn by omxplorer itself, so it looks the same on every computer.</p>
  <div class="row">${desk("s1", s1(), "1 · Menu bar: Data, with a submenu")}${desk("s2", s2(), "2 · Right-click a column header · a tooltip")}${desk("s3", s3(), "3 · Filter a column · the toast with Undo")}
    ${desk("s4", s4(), "4 · Import: preview, types, bad values, loading in the background")}${desk("s5", s5(), "5 · Command palette, Ctrl+K")}${desk("s6", s6(), "6 · Settings → Appearance: every skin ships, Ledger is the default")}
    ${desk("s7", s7(), "7 · Start screen")}</div></section>
  <section class="option"><h2>On a phone</h2><p class="title2">Menus and popovers become bottom sheets with 42-point rows; the same items in the same order.</p>
  <div class="row"><div><div class="frame phone">${p1()}</div><div class="cap">Column actions</div></div><div><div class="frame phone">${p2()}</div><div class="cap">Filter</div></div></div></section>
  <section class="option"><h2>Every component, every state</h2><p class="title2">The hand-off sheet: a developer builds from this, a reviewer checks against it.</p>${board()}</section>`;
  for (const [sid, sel, oid, dx, dy, rel] of placed) {
    const app = document.getElementById(sid), o = document.getElementById(oid);
    let [x, y] = at(app, sel, dx, dy);
    if (rel) { const m = document.getElementById(rel.slice(7)); x = m.offsetLeft + m.offsetWidth - 4; y = m.offsetTop + app.querySelector(sel).offsetTop + dy; }
    o.style.left = x + "px"; o.style.top = y + "px";
  }
}
function skin(name, btn) { document.getElementById("main").className = name; document.querySelectorAll("#skin button").forEach(b => b.classList.toggle("on", b === btn)); render(); }
function size(big, btn) { document.body.classList.toggle("big", !!big); document.querySelectorAll("#sz button").forEach(b => b.classList.toggle("on", b === btn)); }
const q = new URLSearchParams(location.search);
if (q.get("skin")) document.getElementById("main").className = q.get("skin");
if (q.get("big")) document.body.classList.add("big");
render();
// ?only=s3 (a scene, "board", or "p1"/"p2") shows just that, at actual size: for screenshots
if (q.get("only")) { const o = q.get("only"), keep = o === "board" ? document.querySelector(".board") : o.startsWith("p") ? document.querySelectorAll(".frame.phone")[+o[1]-1] : document.getElementById(o).parentElement;
  document.body.classList.add("big"); document.body.style.background = "#fff"; document.body.replaceChildren(document.getElementById("main")); const m = document.getElementById("main"); m.replaceChildren(keep); keep.style.margin = 0; }
</script>
