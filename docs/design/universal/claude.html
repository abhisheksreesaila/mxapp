<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>omxplorer · universal theme · Claude artboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- the three themes: tokens only, the markup is shared ---------- */
.ledger {
  --chrome:#f5f6f8; --chrome-ink:#1b1f24; --chrome-sub:#6b7380; --chrome-hover:#e8eaee; --chrome-line:#e1e4e8; --tool-on:#e3f2f3; --tool-on-ink:#0e7c86;
  --page:#eef0f3; --surface:#ffffff; --raised:#f0f2f5; --sel:#e3f2f3; --line:#e1e4e8; --strong:#c9ced6;
  --ink:#1b1f24; --body:#3d434c; --sub:#6b7380; --accent:#0e7c86; --on-accent:#fff;
  --formula:#6a4fd6; --good:#1f8a4c; --bad:#c8364c; --warn:#b7791f;
  --s1:#0e7c86; --s2:#e8833a; --s3:#5b5fc7; --s4:#d6455d; --s5:#2e9e5b;
}
.graphite {
  --chrome:#121214; --chrome-ink:#ececee; --chrome-sub:#858892; --chrome-hover:#26272b; --chrome-line:#2e3034; --tool-on:#3a2f17; --tool-on-ink:#f5a524;
  --page:#161618; --surface:#1d1e21; --raised:#26272b; --sel:#3a2f17; --line:#2e3034; --strong:#44464c;
  --ink:#ececee; --body:#c2c4ca; --sub:#858892; --accent:#f5a524; --on-accent:#1d1e21;
  --formula:#b48cff; --good:#3ddc97; --bad:#ff6b6b; --warn:#f5a524;
  --s1:#4cc2ff; --s2:#f5a524; --s3:#b48cff; --s4:#3ddc97; --s5:#ff6b6b;
}
.blueprint {
  --chrome:#14213d; --chrome-ink:#e8edf7; --chrome-sub:#9fb0d0; --chrome-hover:#22325a; --chrome-line:#2a3a63; --tool-on:#2f6fed; --tool-on-ink:#ffffff;
  --page:#f3f5f9; --surface:#ffffff; --raised:#f1f4f9; --sel:#e5eefe; --line:#e0e5ee; --strong:#c5cede;
  --ink:#111827; --body:#374151; --sub:#6b7280; --accent:#2f6fed; --on-accent:#fff;
  --formula:#7b3fe4; --good:#138a52; --bad:#d23f57; --warn:#b7791f;
  --s1:#2f6fed; --s2:#f08c2e; --s3:#13a39a; --s4:#d9485f; --s5:#7b61ff;
}

/* ---------- the viewer ---------- */
* { box-sizing:border-box; }
body { margin:0; background:#0b0c0e; color:#ddd; font:14px Inter, system-ui, sans-serif; }
header.viewer { position:sticky; top:0; z-index:5; display:flex; gap:24px; align-items:center; padding:14px 28px; background:#0b0c0eee; border-bottom:1px solid #222; }
header.viewer h1 { font-size:15px; margin:0; font-weight:600; }
header.viewer .seg button { background:#1b1c20; color:#ccc; border:1px solid #2c2d33; padding:6px 14px; font:inherit; cursor:pointer; }
header.viewer .seg button:first-child { border-radius:6px 0 0 6px; } header.viewer .seg button:last-child { border-radius:0 6px 6px 0; }
header.viewer .seg button.on { background:#e8e8ea; color:#111; }
.option { padding:28px; border-bottom:1px solid #1d1e22; }
.option h2 { margin:0 0 4px; font-size:18px; }
.option p.why { margin:0 0 18px; color:#9a9ca3; max-width:900px; }
.row { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
.frame { flex:none; overflow:hidden; border-radius:10px; box-shadow:0 0 0 1px #2a2b30; }
.frame.desk { width:720px; height:450px; } .frame.desk > .app { transform:scale(.5); transform-origin:0 0; }
.frame.phone { width:195px; height:422px; border-radius:22px; } .frame.phone > .ph { transform:scale(.5); transform-origin:0 0; }
body.big .frame.desk { width:1440px; height:900px; } body.big .frame.desk > .app { transform:none; }
body.big .frame.phone { width:390px; height:844px; border-radius:44px; } body.big .frame.phone > .ph { transform:none; }
.cap { font-size:12px; color:#8a8c93; margin-top:6px; }

/* ---------- the app (1440 × 900) ---------- */
.app { width:1440px; height:900px; display:grid; grid-template-rows:38px 74px 40px 1fr 30px; background:var(--page); color:var(--ink); font:13px Inter, sans-serif; }
.mono, .num { font-family:"JetBrains Mono", monospace; font-variant-numeric:tabular-nums; }
.titlebar { display:flex; align-items:center; padding:0 14px; gap:12px; background:var(--chrome); color:var(--chrome-ink); border-bottom:1px solid var(--chrome-line); }
.dots { display:flex; gap:7px; } .dots i { width:11px; height:11px; border-radius:50%; background:var(--chrome-line); display:block; }
.brand { font-weight:700; letter-spacing:-.2px; font-size:14px; } .brand b { color:var(--accent); }
.blueprint .brand b { color:#7fa6ff; }
.doc { flex:1; text-align:center; color:var(--chrome-sub); font-size:12px; } .doc strong { color:var(--chrome-ink); font-weight:600; }
.tbtn { border:1px solid var(--chrome-line); color:var(--chrome-ink); background:transparent; border-radius:6px; padding:4px 12px; font:500 12px Inter; }
.tbtn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.toolbar { display:flex; align-items:center; padding:0 10px; background:var(--chrome); border-bottom:1px solid var(--chrome-line); }
.group { display:flex; padding:0 6px; border-right:1px solid var(--chrome-line); } .group:last-child { border:0; }
.tool { width:64px; height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border-radius:6px; color:var(--chrome-ink); font-size:11px; }
.tool svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.tool.hover { background:var(--chrome-hover); } .tool.on { background:var(--tool-on); color:var(--tool-on-ink); }
.spacer { flex:1; }
.fbar { display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--surface); border-bottom:1px solid var(--line); }
.ref { width:64px; border:1px solid var(--line); border-radius:4px; padding:3px 8px; font-size:12px; text-align:center; }
.fx { color:var(--formula); font-style:italic; font-weight:600; font-family:Georgia, serif; }
.finput { flex:1; border:1px solid var(--accent); border-radius:4px; padding:4px 10px; font-size:12.5px; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); background:var(--surface); }
.finput .c { color:var(--accent); } .finput .op { color:var(--sub); }
.iconbtn { width:26px; height:24px; display:grid; place-items:center; border-radius:4px; color:var(--sub); border:1px solid var(--line); }
.iconbtn.ok { color:var(--on-accent); background:var(--accent); border-color:var(--accent); }
.work { display:grid; grid-template-columns:1fr 300px; min-height:0; }
.gridwrap { overflow:hidden; background:var(--surface); position:relative; }
table.grid { border-collapse:collapse; width:100%; table-layout:fixed; }
.grid th, .grid td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); height:27px; padding:0 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.grid thead th { background:var(--raised); height:58px; text-align:left; vertical-align:top; padding-top:7px; font-weight:600; color:var(--ink); border-bottom:1px solid var(--strong); }
.grid .rn { width:48px; background:var(--raised); color:var(--sub); text-align:right; font-size:11px; }
.grid td { color:var(--body); } .grid td.n { text-align:right; color:var(--ink); }
.grid td.f { color:var(--formula); }
.badge { display:inline-block; font:600 9.5px "JetBrains Mono"; padding:1px 4px; border-radius:3px; background:var(--surface); border:1px solid var(--line); color:var(--sub); margin-left:6px; vertical-align:1px; }
.badge.fx2 { color:var(--formula); border-color:color-mix(in srgb, var(--formula) 40%, transparent); }
.hist { display:flex; align-items:flex-end; gap:1px; height:18px; margin-top:7px; }
.hist i { flex:1; background:color-mix(in srgb, var(--accent) 45%, transparent); display:block; border-radius:1px 1px 0 0; }
.grid th.selcol { background:color-mix(in srgb, var(--accent) 16%, var(--raised)); border-bottom:2px solid var(--accent); }
.grid th.selcol .hist i { background:var(--accent); }
.grid td.selcol { background:var(--sel); }
.grid td.cur { outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface); }
.grid tr.total td { background:var(--raised); font-weight:600; color:var(--ink); border-top:1px solid var(--strong); }
.insp { background:var(--surface); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.itabs { display:flex; border-bottom:1px solid var(--line); }
.itabs span { flex:1; text-align:center; padding:10px 0; font-weight:500; color:var(--sub); font-size:12.5px; }
.itabs span.on { color:var(--ink); box-shadow:inset 0 -2px var(--accent); }
.sec { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
.sec h4 { margin:0; font:600 10.5px Inter; letter-spacing:.8px; color:var(--sub); text-transform:uppercase; }
.segc { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.segc span { flex:1; text-align:center; padding:5px 0; font-size:11.5px; color:var(--body); border-right:1px solid var(--line); } .segc span:last-child { border:0; }
.segc span.on { background:var(--accent); color:var(--on-accent); font-weight:600; }
.prow { display:flex; align-items:center; justify-content:space-between; color:var(--body); font-size:12.5px; }
.stepper { display:flex; border:1px solid var(--line); border-radius:4px; } .stepper span { padding:2px 9px; } .stepper span:nth-child(2) { border-left:1px solid var(--line); border-right:1px solid var(--line); color:var(--ink); }
.switch { width:30px; height:17px; border-radius:9px; background:var(--accent); position:relative; } .switch::after { content:""; position:absolute; right:2px; top:2px; width:13px; height:13px; border-radius:50%; background:var(--on-accent); }
.dd { border:1px solid var(--line); border-radius:4px; padding:3px 8px; color:var(--ink); font-size:12px; min-width:90px; display:flex; justify-content:space-between; gap:8px; } .dd::after { content:"⌄"; color:var(--sub); }
.stats { display:grid; grid-template-columns:1fr auto; gap:5px 10px; font-size:12px; } .stats span:nth-child(odd) { color:var(--sub); } .stats span:nth-child(even) { text-align:right; color:var(--ink); font-family:"JetBrains Mono"; }
.bighist { display:flex; align-items:flex-end; gap:2px; height:54px; } .bighist i { flex:1; background:var(--accent); opacity:.75; border-radius:2px 2px 0 0; display:block; }
.bottom { display:flex; align-items:stretch; background:var(--chrome); border-top:1px solid var(--chrome-line); color:var(--chrome-sub); font-size:12px; }
.blueprint .bottom { background:var(--raised); border-top-color:var(--line); color:var(--sub); }
.stabs { display:flex; align-items:stretch; padding-left:56px; }
.stab { padding:0 16px; display:flex; align-items:center; color:var(--chrome-sub); }
.blueprint .stab { color:var(--sub); }
.stab.on { background:var(--surface); color:var(--ink); font-weight:600; box-shadow:inset 0 2px var(--accent); border-left:1px solid var(--line); border-right:1px solid var(--line); }
.stab.plus { font-size:15px; }
.status { margin-left:auto; display:flex; gap:18px; align-items:center; padding-right:14px; } .status b { color:var(--ink); font-weight:500; }
.graphite .status b { color:var(--chrome-ink); }
.gpu { display:inline-flex; align-items:center; gap:6px; } .gpu i { width:7px; height:7px; border-radius:50%; background:var(--good); display:block; }

/* ---------- the report ---------- */
.rwrap { overflow:hidden; padding:22px 30px; }
.rpage { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:22px 26px; display:flex; flex-direction:column; gap:16px; }
.rhead { display:flex; align-items:baseline; gap:14px; } .rhead h1 { margin:0; font-size:20px; font-weight:700; } .rhead span { color:var(--sub); font-size:12px; }
.chips { display:flex; gap:8px; } .chip { border:1px solid var(--line); border-radius:4px; padding:4px 10px; font-size:12px; color:var(--body); background:var(--raised); }
.chip.on { background:color-mix(in srgb, var(--accent) 13%, var(--surface)); border-color:color-mix(in srgb, var(--accent) 45%, transparent); color:var(--ink); } .chip.on::after { content:"  ✕"; color:var(--sub); }
.chip.add { background:transparent; border-style:dashed; color:var(--sub); }
.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.kpi { border:1px solid var(--line); border-radius:6px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.kpi.sel { border:2px solid var(--accent); padding:11px 13px; }
.kpi .l { color:var(--sub); font-size:12px; } .kpi .v { font:600 24px "JetBrains Mono"; letter-spacing:-.5px; }
.kpi .foot { display:flex; justify-content:space-between; align-items:flex-end; }
.delta { font:600 11px "JetBrains Mono"; padding:2px 6px; border-radius:4px; }
.delta.up { color:var(--good); background:color-mix(in srgb, var(--good) 13%, transparent); } .delta.dn { color:var(--bad); background:color-mix(in srgb, var(--bad) 13%, transparent); }
.charts { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.card { border:1px solid var(--line); border-radius:6px; padding:12px 14px; } .card h3 { margin:0 0 8px; font-size:13px; font-weight:600; }
.card svg text { font:10.5px "JetBrains Mono"; fill:var(--sub); }
table.pv { width:100%; border-collapse:collapse; font-size:12px; } .pv th, .pv td { padding:5px 8px; border-bottom:1px solid var(--line); text-align:right; } .pv th:first-child, .pv td:first-child { text-align:left; }
.pv th { color:var(--sub); font-weight:500; background:var(--raised); } .pv td { font-family:"JetBrains Mono"; color:var(--body); } .pv td:first-child { font-family:Inter; color:var(--ink); }
.pv tr.t td, .pv td.t { font-weight:600; color:var(--ink); }

/* ---------- phone (390 × 844) ---------- */
.ph { width:390px; height:844px; background:var(--surface); color:var(--ink); font:13px Inter; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.ph .top { background:var(--chrome); color:var(--chrome-ink); padding:54px 16px 10px; display:flex; align-items:center; gap:10px; font-weight:600; }
.ph .top span { flex:1; text-align:center; }
.ph .tools { background:var(--chrome); display:flex; gap:6px; padding:4px 10px 10px; border-bottom:1px solid var(--chrome-line); }
.ph .tools span { flex:1; height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; color:var(--chrome-ink); border-radius:10px; }
.ph .tools svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6; }
.ph table.grid th { height:52px; } .ph table.grid td { height:34px; }
.sheet { position:absolute; left:0; right:0; bottom:0; height:330px; background:var(--surface); border-top:1px solid var(--line); border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.18); padding:10px 18px 0; display:flex; flex-direction:column; gap:10px; }
.grab { width:38px; height:5px; border-radius:3px; background:var(--strong); align-self:center; }
.tabbar { position:absolute; left:50%; transform:translateX(-50%); bottom:22px; display:flex; gap:4px; padding:5px; border-radius:26px; background:var(--chrome); border:1px solid var(--chrome-line); box-shadow:0 6px 20px rgba(0,0,0,.2); }
.tabbar span { padding:11px 18px; border-radius:20px; color:var(--chrome-sub); font-weight:600; font-size:12.5px; } .tabbar span.on { background:var(--accent); color:var(--on-accent); }
</style>
</head>
<body>
<header class="viewer">
  <h1>omxplorer · one theme on every platform</h1>
  <div class="seg"><button class="on" onclick="size(0,this)">Overview</button><button onclick="size(1,this)">Actual size</button></div>
  <span style="color:#8a8c93;font-size:12px">Inter for words, JetBrains Mono for numbers, both shipped inside the app, so Linux, Mac, Windows, the web and iPad render identically.</span>
</header>
<main id="main"></main>

<script>
const OPTIONS = [
  ["ledger", "A · Ledger", "Light and classic, like Excel or Numbers: white sheet, quiet grey chrome, one deep teal accent. The safest choice for long sessions and for screenshots in slides and docs."],
  ["graphite", "B · Graphite", "Dark and neutral, for people who live in VS Code and Jupyter: no blue tint, crisp white figures, a warm amber accent that is easy to find on dark."],
  ["blueprint", "C · Blueprint", "Light with a branded navy band, the way Office apps carry a coloured title bar: instantly recognisable as omxplorer on any desktop, the sheet itself stays white and calm."],
];
const I = {
  open:'<path d="M3 7h6l2 2h10v10H3z"/>', save:'<path d="M5 3h11l3 3v15H5z M8 3v6h8 M8 21v-7h8v7"/>', undo:'<path d="M9 14 4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3"/>', redo:'<path d="m15 14 5-5-5-5 M20 9H10a6 6 0 0 0 0 12h3"/>',
  table:'<path d="M3 4h18v16H3z M3 10h18 M3 15h18 M9 4v16"/>', chart:'<path d="M4 20V10 M10 20V4 M16 20v-7 M3 20h18"/>', pivot:'<path d="M3 3h18v18H3z M3 9h18 M9 3v18 M13 13h5 M13 16h5"/>',
  formula:'<path d="M9 20c2 0 2-3 3-8s1-8 3-8 M8 11h8"/>', row:'<path d="M3 5h18v6H3z M12 15v6 M9 18h6"/>', sort:'<path d="M7 4v16 M3 16l4 4 4-4 M17 20V4 M13 8l4-4 4 4"/>',
  filter:'<path d="M3 4h18l-7 9v6l-4 2v-8z"/>', format:'<path d="M4 20h4L19 9l-4-4L4 16z M13 7l4 4"/>', kpi:'<path d="M4 18h16 M6 14l4-5 4 3 5-7"/>', text:'<path d="M5 6V4h14v2 M12 4v16 M9 20h6"/>',
};
const svg = k => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
const tool = (k, label, cls="") => `<div class="tool ${cls}">${svg(k)}${label}</div>`;
// deterministic data
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const REG = ["West","East","North","South","Central"], PROD = ["Desk Chair","Monitor Arm","Standing Desk","Lamp","Keyboard","Webcam"], CAR = ["UPS","FedEx","DHL","USPS"];
const CUST = ["Acme Labs","Northwind","Globex","Initech","Umbrella Co","Hooli","Stark Ind.","Wayne Ent.","Vandelay","Soylent"];
const money = v => "$" + v.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const rows = Array.from({length:22}, (_, i) => {
  const qty = 1 + Math.floor(rnd()*9), rev = Math.round((40 + rnd()*1900) * 100) / 100, cost = Math.round(rev * (0.55 + rnd()*0.2) * 100) / 100;
  return [String(1048213 + i*37), `2026-07-${String(1 + Math.floor(rnd()*28)).padStart(2,"0")}`, REG[Math.floor(rnd()*5)], CUST[Math.floor(rnd()*10)], PROD[Math.floor(rnd()*6)], CAR[Math.floor(rnd()*4)], qty, rev, cost];
});
const hist = n => Array.from({length:n}, (_, k) => `<i style="height:${Math.round(18 + 80*Math.exp(-((k - n*0.32)**2)/(n*1.4)) + rnd()*10)}%"></i>`).join("");
const flat = n => Array.from({length:n}, () => `<i style="height:${Math.round(40 + rnd()*55)}%"></i>`).join("");

function chrome(doc, report) {
  return `
  <div class="titlebar"><div class="dots"><i></i><i></i><i></i></div><span class="brand">o<b>mx</b>plorer</span>
    <span class="doc"><strong>${doc}</strong> — 1,000,000 rows</span><button class="tbtn">Share</button><button class="tbtn primary">Save</button></div>
  <div class="toolbar">
    <div class="group">${tool("open","Open")}${tool("save","Save")}${tool("undo","Undo")}${tool("redo","Redo")}</div>
    <div class="group">${tool("table","Table")}${tool("chart","Chart", report ? "" : "hover")}${tool("pivot","Pivot")}${tool("formula","Formula", report ? "" : "on")}${report ? tool("kpi","KPI","on") + tool("text","Text") : tool("row","Add row")}</div>
    <div class="group">${tool("sort","Sort")}${tool("filter","Filter", report ? "on" : "")}</div>
    <div class="spacer"></div><div class="group">${tool("format","Format","on")}</div>
  </div>`;
}
function bottom(report) {
  return `<div class="bottom"><div class="stabs"><span class="stab ${report ? "" : "on"}">Orders</span><span class="stab ${report ? "on" : ""}">Report</span><span class="stab plus">+</span></div>
    <div class="status num">${report ? `<span>Filtered <b>255,102</b> of 1,000,000 rows</span>` :
      `<span>Sum <b>$72,061,236.00</b></span><span>Average <b>$72.06</b></span><span>Count <b>1,000,000</b></span>`}
      <span class="gpu"><i></i>RTX 4090 · <b>${report ? "4.1" : "0.3"} ms</b></span></div></div>`;
}
function sheet(doc="orders.csv") {
  const cols = [["order_id","#"],["date","📅"],["region","Aa"],["customer","Aa"],["product","Aa"],["carrier","Aa"],["qty","#"],["revenue","$"],["cost","$"],["margin","ƒx"]];
  const widths = [92,98,80,112,120,80,66,108,100,104];
  const head = cols.map(([n,b], c) => `<th class="${c===7?"selcol":""}" style="width:${widths[c]}px">${n}<span class="badge ${b==="ƒx"?"fx2":""}">${b==="📅"?"date":b}</span><div class="hist">${b==="Aa"? flat(c===2?5:c===5?4:12) : hist(16)}</div></th>`).join("");
  const body = rows.map((r, i) => `<tr><td class="rn num">${i+1}</td>
    <td class="num">${r[0]}</td><td class="num">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td>
    <td class="n num">${r[6]}</td><td class="n num selcol ${i===11?"cur":""}">${money(r[7])}</td><td class="n num">${money(r[8])}</td><td class="n num f">${money(Math.round((r[7]-r[8])*100)/100)}</td></tr>`).join("");
  return `<div class="app">${chrome(doc,false)}
  <div class="fbar"><span class="ref num">J12</span><span class="fx">fx</span><div class="finput num"><span class="c">margin</span> <span class="op">=</span> <span class="c">revenue</span> <span class="op">−</span> <span class="c">cost</span></div><span class="iconbtn">✕</span><span class="iconbtn ok">✓</span></div>
  <div class="work"><div class="gridwrap"><table class="grid"><thead><tr><th class="rn"></th>${head}</tr></thead><tbody>${body}
    <tr class="total"><td class="rn"></td><td colspan="6">Total · 1,000,000 rows</td><td class="n num">5,002,114</td><td class="n num">$72,061,236.00</td><td class="n num">$46,124,980.12</td><td class="n num f" style="color:var(--formula)">$25,936,255.88</td></tr></tbody></table></div>
  <div class="insp"><div class="itabs"><span class="on">Format</span><span>Column</span><span>Table</span></div>
    <div class="sec"><h4>Number</h4><div class="segc"><span>Auto</span><span>Number</span><span class="on">Currency</span><span>Percent</span></div>
      <div class="prow">Decimals<div class="stepper num"><span>−</span><span>2</span><span>+</span></div></div>
      <div class="prow">Thousands separator<div class="switch"></div></div>
      <div class="prow">Negatives<div class="segc num" style="width:150px"><span class="on">−1,234</span><span>(1,234)</span></div></div>
      <div class="prow">Symbol<div class="dd">$ USD</div></div></div>
    <div class="sec"><h4>Column stats · revenue</h4><div class="stats"><span>Count</span><span>1,000,000</span><span>Empty</span><span>0</span><span>Distinct</span><span>812,441</span><span>Min</span><span>$4.20</span><span>Max</span><span>$9,980.00</span><span>Mean</span><span>$72.06</span></div>
      <div class="bighist">${hist(28)}</div><div class="prow" style="font-size:11px;color:var(--sub)"><span class="num">$0</span><span>computed on the GPU in 0.3 ms</span><span class="num">$10k</span></div></div>
  </div></div>${bottom(false)}</div>`;
}
function spark(up) {
  let y = 20, pts = []; for (let i = 0; i < 16; i++) { y += (rnd() - (up ? .62 : .4)) * 6; y = Math.max(3, Math.min(25, y)); pts.push(`${i*6},${y.toFixed(1)}`); }
  return `<svg width="92" height="28"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--s1)" stroke-width="1.6"/></svg>`;
}
function report() {
  const kpi = (l, v, d, up, sel) => `<div class="kpi ${sel?"sel":""}"><span class="l">${l}</span><span class="v">${v}</span><div class="foot"><span class="delta ${up?"up":"dn"}">${d}</span>${spark(up)}</div></div>`;
  const months = [4.9,5.2,5.0,5.6,5.9,5.7,6.1,6.3,6.0], W = 560, H = 170;
  const px = i => 40 + i * (W - 60) / 8, py = v => H - 22 - (v - 4.5) / 2.1 * (H - 40);
  const line = `<svg width="100%" viewBox="0 0 ${W} ${H}">${[5,5.5,6,6.5].map(v=>`<line x1="40" x2="${W-10}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)"/><text x="4" y="${py(v)+3}">$${v}M</text>`).join("")}
    <polyline points="${months.map((v,i)=>`${px(i)},${py(v)}`).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2"/>
    ${months.map((v,i)=>`<text x="${px(i)-8}" y="${H-4}">${"JFMAMJJAS"[i]}</text>`).join("")}
    <circle cx="${px(7)}" cy="${py(6.3)}" r="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="2"/>
    <rect x="${px(7)-46}" y="${py(6.3)-32}" width="92" height="20" rx="4" fill="var(--ink)"/><text x="${px(7)-40}" y="${py(6.3)-18}" style="fill:var(--surface)">Aug · $6.3M</text></svg>`;
  const car = [["UPS",7.1],["FedEx",5.4],["DHL",3.6],["USPS",2.3]];
  const bars = `<svg width="100%" viewBox="0 0 ${W} ${H}">${car.map(([n,v],i)=>`<text x="4" y="${30+i*36}">${n}</text><rect x="60" y="${17+i*36}" width="${v/7.1*400}" height="20" rx="3" fill="var(--s${i+1})"/><text x="${68+v/7.1*400}" y="${31+i*36}" style="fill:var(--ink)">$${v}M</text>`).join("")}</svg>`;
  const P = ["Desk Chair","Monitor Arm","Standing Desk","Lamp","Keyboard"];
  const pv = `<table class="pv"><tr><th>region</th>${P.map(p=>`<th>${p}</th>`).join("")}<th>Total</th></tr>
    ${REG.map(r=>{ const v = P.map(()=>0.4+rnd()*1.2); return `<tr><td>${r}</td>${v.map(x=>`<td>$${x.toFixed(2)}M</td>`).join("")}<td class="t">$${v.reduce((a,b)=>a+b).toFixed(2)}M</td></tr>`}).join("")}
    <tr class="t"><td>Total</td>${P.map(()=>`<td>$${(3+rnd()*3).toFixed(2)}M</td>`).join("")}<td>$18.40M</td></tr></table>`;
  return `<div class="app">${chrome("orders.omx",true)}
  <div class="fbar"><span class="ref num">Tile 1</span><span class="fx">fx</span><div class="finput num" style="border-color:var(--line);box-shadow:none"><span class="c">sum</span>(<span class="c">revenue</span>) <span class="op">where</span> <span class="c">region</span> <span class="op">=</span> "West"</div></div>
  <div class="work"><div class="rwrap"><div class="rpage">
    <div class="rhead"><h1>Q3 orders</h1><span>Updated just now · 1,000,000 rows · 4.1 ms on the GPU</span></div>
    <div class="chips"><span class="chip on">region = West</span><span class="chip on">date: Jul–Sep 2026</span><span class="chip">carrier: all</span><span class="chip add">+ Filter</span></div>
    <div class="kpis">${kpi("Revenue","$18.4M","+4.2%",1,1)}${kpi("Orders","255,102","+1.1%",1)}${kpi("Average order","$72.06","−0.8%",0)}${kpi("Margin","31.4%","+0.6 pts",1)}</div>
    <div class="charts"><div class="card"><h3>Revenue by month</h3>${line}</div><div class="card"><h3>Revenue by carrier</h3>${bars}</div></div>
    <div class="card"><h3>Revenue · region × product</h3>${pv}</div>
  </div></div>
  <div class="insp"><div class="itabs"><span class="on">Tile</span><span>Data</span></div>
    <div class="sec"><h4>Value</h4><div class="prow">Column<div class="dd">revenue</div></div><div class="segc"><span class="on">Sum</span><span>Average</span><span>Count</span></div></div>
    <div class="sec"><h4>Compare</h4><div class="prow">Compare to<div class="dd">previous quarter</div></div><div class="prow">Show sparkline<div class="switch"></div></div></div>
    <div class="sec"><h4>Format</h4><div class="segc"><span>Auto</span><span>Number</span><span class="on">Compact</span></div><div class="prow">Symbol<div class="dd">$ USD</div></div></div>
  </div></div>${bottom(true)}</div>`;
}
function phone() {
  const t = (k,l) => `<span>${svg(k)}${l}</span>`;
  const body = rows.slice(0,9).map((r,i)=>`<tr><td class="rn num">${i+1}</td><td class="num">${r[0]}</td><td>${r[2]}</td><td class="n num selcol">${money(r[7])}</td></tr>`).join("");
  return `<div class="ph"><div class="top">‹<span>orders.csv</span>⋯</div>
    <div class="tools">${t("chart","Chart")}${t("pivot","Pivot")}${t("formula","Formula")}${t("sort","Sort")}${t("filter","Filter")}${t("format","Format")}</div>
    <table class="grid" style="background:var(--surface)"><thead><tr><th class="rn" style="width:34px"></th><th style="width:96px">order_id<div class="hist">${hist(10)}</div></th><th style="width:84px">region<div class="hist">${flat(5)}</div></th><th class="selcol">revenue<span class="badge">$</span><div class="hist">${hist(12)}</div></th></tr></thead><tbody>${body}</tbody></table>
    <div class="sheet"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">revenue</b><span style="color:var(--sub);font-size:12px">Currency · 2 decimals</span></div>
      <div class="stats" style="font-size:13px"><span>Sum</span><span>$72,061,236.00</span><span>Average</span><span>$72.06</span><span>Count</span><span>1,000,000</span></div>
      <div class="bighist">${hist(22)}</div></div>
    <div class="tabbar"><span class="on">Sheet</span><span>Report</span><span>+</span></div></div>`;
}
document.getElementById("main").innerHTML = OPTIONS.map(([cls, name, why]) => { seed = 7; return `
  <section class="option"><h2>${name}</h2><p class="why">${why}</p>
  <div class="row"><div><div class="frame desk ${cls}">${sheet()}</div><div class="cap">Sheet · 1440 × 900</div></div>
  <div><div class="frame desk ${cls}">${report()}</div><div class="cap">Report</div></div>
  <div><div class="frame phone ${cls}">${phone()}</div><div class="cap">iPhone</div></div></div></section>`; }).join("");
function size(big, btn) { document.body.classList.toggle("big", !!big); document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b === btn)); }
</script>
</body>
